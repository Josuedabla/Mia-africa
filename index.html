<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Content-Security-Policy (recommandation audit sécurité) : liste
         explicite de tout ce que MIA charge réellement, plutôt qu'une
         policy permissive. À ajuster si un nouveau domaine externe est
         ajouté ailleurs dans l'app (ex: nouveau CDN) - sinon le
         navigateur bloquera silencieusement la ressource.
         connect-src inclut *.supabase.co (API + Storage + Realtime
         websocket wss:) et les domaines Moneroo/Chariow pour les retours
         de paiement. frame-src autorise les embeds vidéo YouTube/TikTok
         (lecteur in-app, zéro redirection) - Facebook/Instagram exclus
         volontairement pour l'instant (voir plan de croissance Partie 4.1). -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://translate.google.com https://www.gstatic.com https://vercel.live;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https: blob:;
      media-src 'self' https:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.moneroo.io https://api.chariow.com https://vercel.live https://*.vercel-insights.com;
      frame-src https://www.youtube.com https://www.tiktok.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MIA Marketplace - Market Intelligence Africa. Découvrez les meilleures boutiques et produits d'Afrique de l'Ouest." />
    <meta name="keywords" content="marketplace, ecommerce, Togo, Bénin, Cameroun, Ghana, shopping, Afrique" />
    <meta name="theme-color" content="#00A651" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MIA Marketplace" />
    <link rel="apple-touch-icon" href="/logo.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="MIA Marketplace - Market Intelligence Africa" />
    <meta property="og:description" content="Découvrez les meilleures boutiques et produits d'Afrique de l'Ouest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mia-marketplace-ec510.web.app" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MIA Marketplace" />
    <meta name="twitter:description" content="Découvrez les meilleures boutiques et produits d'Afrique de l'Ouest" />
    <meta name="twitter:image" content="/logo.png" />
    
    <!-- Preload critical resources -->
    <link rel="preload" as="image" href="/logo.png" />
    
    <title>MIA Marketplace - Market Intelligence Africa</title>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Google Translate Widget -->
    <div id="google_translate_element" style="position:fixed; bottom:20px; right:20px; z-index:9999;"></div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Google Translate Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'fr',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
      
      // Auto-detect user language and translate if not French
      var userLang = (navigator.language || navigator.userLanguage).substring(0, 2);
      if (userLang !== 'fr') {
        var checkSelectExist = setInterval(function() {
          var selectEl = document.querySelector('.goog-te-combo');
          if (selectEl) {
            selectEl.value = userLang;
            selectEl.dispatchEvent(new Event('change'));
            clearInterval(checkSelectExist);
          }
        }, 300);
        
        // Stop checking after 5 seconds
        setTimeout(function() { clearInterval(checkSelectExist); }, 5000);
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('Service Worker registered:', registration);
            })
            .catch(error => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
